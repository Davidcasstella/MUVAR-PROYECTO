<div class="recuperar-contenedor">
  <div class="recuperar-tarjeta">
    <div class="recuperar-cabecera">
      <h1 class="recuperar-titulo">Recuperar Contraseña</h1>
      <p class="recuperar-subtitulo">
        Ingresa tu correo electrónico y te enviaremos instrucciones para recuperar tu contraseña
      </p>
    </div>

    @if (!enviado) {
      <form [formGroup]="formulario" (ngSubmit)="enviar()" class="recuperar-formulario">
        <div class="campo-formulario">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
          />
        </div>

        <button
          type="submit"
          class="boton-submit"
          [disabled]="formulario.invalid"
        >
          Enviar Instrucciones
        </button>
      </form>
    } @else {
      <div class="recuperar-exito">
        <div class="exito-icono">✉️</div>
        <h2>¡Correo enviado!</h2>
        <p>Si el correo existe en nuestros registros, recibirás instrucciones para recuperar tu contraseña.</p>
        <button class="boton-volver" (click)="router.navigate(['/acceso'])">Volver al inicio de sesión</button>
      </div>
    }

    <div class="recuperar-pie">
      <a routerLink="/acceso" class="enlace">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>
