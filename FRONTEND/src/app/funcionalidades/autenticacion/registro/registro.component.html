<div class="registro-contenedor">
  <div class="registro-tarjeta">
    <div class="registro-cabecera">
      <h1 class="registro-titulo">Crear Cuenta</h1>
      <p class="registro-subtitulo">Regístrate para comenzar a usar la plataforma</p>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="registrarse()" class="registro-formulario">
      <div class="campo-formulario">
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder="Juan Pérez"
        />
      </div>

      <div class="campo-formulario">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ejemplo@correo.com"
        />
      </div>

      <div class="campo-formulario">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
        />
      </div>

      <div class="campo-formulario">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input
          id="confirmarPassword"
          type="password"
          formControlName="confirmarPassword"
          placeholder="Repite tu contraseña"
        />
      </div>

      <button
        type="submit"
        class="boton-submit"
        [disabled]="cargando || formulario.invalid"
      >
        {{ cargando ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="registro-pie">
      <p>¿Ya tienes cuenta? <a routerLink="/acceso" class="enlace">Inicia sesión</a></p>
    </div>
  </div>
</div>
