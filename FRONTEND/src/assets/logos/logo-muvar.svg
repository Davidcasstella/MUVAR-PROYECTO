<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Texto INVERSIONES - pequeño, gris, arriba -->
  <text x="60" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#666666">
    INVERSIONES
  </text>

  <!-- Texto MUVAR - grande, verde oscuro, abajo -->
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="2" fill="#2d5a3d">
    MUVAR
  </text>

  <!-- M estilizada con corazón rojo -->
  <g transform="translate(8, 15)">
    <!-- Parte izquierda de la M -->
    <path d="M0 45 L0 20 L12 32 L12 45" stroke="#2d5a3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Parte derecha de la M -->
    <path d="M12 45 L12 20 L24 32 L24 45" stroke="#2d5a3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Centro de la M -->
    <path d="M12 45 L12 25" stroke="#2d5a3d" stroke-width="6" stroke-linecap="round"/>

    <!-- Corazón en la parte superior -->
    <path d="M12 18 C12 18 8 14 8 12 C8 9 9.5 8 12 8 C14.5 8 16 9 16 12 C16 14 12 18 12 18 Z"
          fill="#c1272d"
          transform="translate(0, -2)"/>
  </g>
</svg>
